name: Cache-Clean

on:
  #schedule:
   # - cron: 0 20 * * 0
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{secrets.GITHUB_TOKEN}}
      GH_REPO: ${{github.repository}}
    steps:
      - name: Cache Clean
        run: gh cache delete --all --succeed-on-no-caches || true
