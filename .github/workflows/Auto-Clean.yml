name: Auto-Clean

on:
  # 保留历史固件 Release、标签和工作流记录，避免清理任务误删审计证据。
  # 如确需清理，请在 GitHub 页面人工选择目标并确认后执行。
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  safe-retention:
    runs-on: ubuntu-latest
    steps:
      - name: Explain retention policy
        run: |
          {
            echo "## Automatic cleanup is disabled"
            echo "Release assets, tags, and workflow run history are retained for traceability."
            echo "No releases, tags, caches, or workflow runs were deleted."
          } >> "$GITHUB_STEP_SUMMARY"
