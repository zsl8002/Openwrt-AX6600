#CI项目
name: WRT-TEST

#CI计划
on:
  #手动编译
  workflow_dispatch:
    inputs:
      CONFIG:
        default: 'IPQ60XX-WIFI-YES'
        required: true
        type: choice
        options:
          - IPQ60XX-WIFI-YES
      SOURCE:
        description: '仅允许经过验证的 AX6600 稳定源码仓库。'
        default: 'ones20250/immortalwrt_ipq'
        required: true
        type: choice
        options:
          - ones20250/immortalwrt_ipq
      BRANCH:
        description: '稳定版固定 Commit；禁止 SNAPSHOT、master、开发分支及任意分支。'
        default: 'ff74343745c7ba238f959372aca5a182d2eafb8f'
        required: true
        type: choice
        options:
          - ff74343745c7ba238f959372aca5a182d2eafb8f
      PACKAGE:
        required: false
        type: string
      PROFILE:
        description: '固件版本：PURE=纯净版，PLUS=Plus 版。'
        default: 'PURE'
        required: true
        type: choice
        options:
          - PURE
          - PLUS
      TEST:
        description: '仅输出配置文件，不编译固件。'
        default: true
        required: true
        type: boolean

#CI权限
permissions:
  contents: read

#CI任务
jobs:
  config:
    name: ${{inputs.CONFIG}}
    permissions:
      contents: write
      actions: write
    #调用公用编译核心WRT-CORE.yml
    uses: ./.github/workflows/WRT-CORE.yml
    with:
      #编译配置
      WRT_CONFIG: ${{inputs.CONFIG}}
      #默认主题
      WRT_THEME: aurora
      #默认主机名
      WRT_NAME: OWRT
      #默认WIFI名称
      WRT_SSID: OWRT
      #默认地址
      WRT_IP: 192.168.10.1
      #默认密码，仅作提示，修改无用
      WRT_PW: 无
      #源码链接
      WRT_REPO: https://github.com/${{inputs.SOURCE}}.git
      #源码分支
      WRT_BRANCH: ${{inputs.BRANCH}}
      #源码名称
      WRT_SOURCE: ${{inputs.SOURCE}}
      #插件调整
      WRT_PACKAGE: ${{inputs.PACKAGE}}
      #固件版本
      WRT_PROFILE: ${{inputs.PROFILE}}
      #仅输出配置文件
      WRT_TEST: ${{inputs.TEST && 'true' || 'false'}}
    secrets:
      WRT_WORD: ${{secrets.WRT_WIFI_PASSWORD}}
