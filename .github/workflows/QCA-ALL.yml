#CI项目
name: QCA-ALL

#CI计划
on:
  #自动编译：当Auto-Clean运行完成后
  workflow_run:
    workflows: ["Auto-Clean"]
    types:
      - completed
  #手动编译
  workflow_dispatch:
    inputs:
      PACKAGE:
        description: '手动调整插件包，多个请用\n符号隔开。'
        required: false
        type: string
      TEST:
        description: '仅输出配置文件，不编译固件。'
        default: false
        required: false
        type: boolean

#CI权限
permissions:
  contents: read

#CI任务
jobs:
  config:
    name: ${{matrix.CONFIG}}
    permissions:
      contents: write
      actions: write
    strategy:
      fail-fast: false
      #max-parallel: 3
      matrix:
        CONFIG: [IPQ60XX-WIFI-YES]
        PROFILE: [PURE, PLUS]
        SOURCE: [ones20250/immortalwrt_ipq]
        BRANCH: [ff74343745c7ba238f959372aca5a182d2eafb8f]

    #调用公用编译核心WRT-CORE.yml
    uses: ./.github/workflows/WRT-CORE.yml
    with:
      #编译配置
      WRT_CONFIG: ${{matrix.CONFIG}}
      #默认主题
      #WRT_THEME: aurora
      WRT_THEME: argon
      #默认主机名
      WRT_NAME: OWRT
      #默认WIFI名称
      WRT_SSID: OWRT
      #默认地址
      WRT_IP: 192.168.10.1
      #默认密码，仅作提示，修改无用
      WRT_PW: 无
      #源码链接
      WRT_REPO: https://github.com/${{matrix.SOURCE}}.git
      #源码分支
      WRT_BRANCH: ${{matrix.BRANCH}}
      #源码名称
      WRT_SOURCE: ${{matrix.SOURCE}}
      #插件调整
      WRT_PACKAGE: ${{inputs.PACKAGE}}
      #固件版本：PURE=纯净版，PLUS=Plus 版
      WRT_PROFILE: ${{matrix.PROFILE}}
      #仅输出配置文件
      # workflow_dispatch boolean must be converted to the reusable workflow's string input.
      WRT_TEST: ${{inputs.TEST && 'true' || 'false'}}
    secrets:
      WRT_WORD: ${{secrets.WRT_WIFI_PASSWORD}}
