name: Security Audit

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check workflow and shell security invariants
        shell: bash
        run: |
          set -Eeuo pipefail
          fail=0

          echo "== Third-party Actions must be pinned to full commit SHAs =="
          if grep -RInE '^[[:space:]]*uses:[[:space:]]*[^./[:space:]]+@' .github/workflows | grep -vE '@[0-9a-f]{40}([[:space:]]+#.*)?$'; then
            echo "::error::Floating or non-SHA GitHub Action reference detected."
            fail=1
          fi

          echo "== No globally exported GitHub token =="
          if grep -RInE '^[[:space:]]*GITHUB_TOKEN:[[:space:]]*\$\{\{[[:space:]]*secrets\.GITHUB_TOKEN' .github/workflows; then
            echo "::error::GITHUB_TOKEN must not be exported globally."
            fail=1
          fi

          echo "== No public release of credentials or weak Wi-Fi defaults =="
          if grep -nE '管理密码：\$\{\{|WiFi 密码：\$\{\{|12345678' .github/workflows/WRT-CORE.yml Scripts/Settings.sh; then
            echo "::error::Credential disclosure or weak default detected."
            fail=1
          fi

          echo "== Package sources must use full immutable commit pins =="
          if ! grep -qE 'local PKG_COMMIT_PIN=\$3' Scripts/Packages.sh ||
             grep -nE '^[[:space:]]*UPDATE_PACKAGE .*"(master|main|dev|latest)"' Scripts/Packages.sh; then
            echo "::error::Unpinned plugin source detected."
            fail=1
          fi

          echo "== Shell syntax checks =="
          while IFS= read -r -d '' file; do
            bash -n "$file" || fail=1
          done < <(find Scripts .github/scripts tests -type f -name '*.sh' -print0)

          echo "== Known malformed U-Boot command check =="
          if grep -RInF '&& &&' Docs; then
            echo "::error::Malformed chained command found."
            fail=1
          fi

          if (( fail != 0 )); then
            exit 1
          fi
          echo "Security invariants passed."
