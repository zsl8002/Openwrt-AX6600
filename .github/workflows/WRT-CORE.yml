            固件版本：${{ env.WRT_PROFILE }}
            版本说明：${{ env.WRT_PROFILE_DESC }}
            提交版本：${{ env.WRT_HASH }}
            编译时间：${{ env.WRT_DATE }}
            ━━━━━━━━━━━━━━━━━━━━━━━

            📌 外部插件来源
            ${{ env.WRT_PKG_INFO }}
            ━━━━━━━━━━━━━━━━━━━━━━━

            🧩 设备与平台
            设备型号：${{ env.WRT_SOURCE }}
            硬件平台：${{ env.WRT_TARGET }}
            CPU架构：Qualcomm IPQ6010 / IPQ60xx
            ━━━━━━━━━━━━━━━━━━━━━━━

            ⚙️ 固件特性
            - Qualcomm PPE 开源硬件加速 + Linux 原生 Flowtable 硬件卸载
            - SONiC FullCone NAT1 游戏穿透支持
            - 基于 Linux 6.18 LTS 内核 / firewall4 架构
            - 常用 LuCI 插件预集成
