  cache-rollover:
    name: Roll cache generations
    permissions:
      actions: write
      contents: read
    needs: core
    if: ${{ !inputs.WRT_TEST && needs.core.result == 'success' }}
    runs-on: ubuntu-latest
    concurrency:
      group: wrt-cache-rollover-${{github.ref}}-${{needs.core.outputs.cache_prefix}}
      cancel-in-progress: false
    env:
      GH_REPO: ${{github.repository}}
      GH_TOKEN: ${{secrets.GITHUB_TOKEN}}
      WRT_CACHE_PREFIX: ${{needs.core.outputs.cache_prefix}}
      WRT_CACHE_KEY: ${{needs.core.outputs.cache_key}}
      WRT_CACHE_STARTED: ${{needs.core.outputs.cache_started}}
    steps:
      - name: Roll Build Cache
        # 清理异常只警告，不把已发布固件标为构建失败。
        continue-on-error: true
        run: |
          set -euo pipefail
          CACHES=$(gh cache list --repo "$GH_REPO" --key "$WRT_CACHE_PREFIX-" --ref "$GITHUB_REF" --limit 100 --json id,key,createdAt)
          CURRENT_CREATED=$(jq -r --arg key "$WRT_CACHE_KEY" '[.[] | select(.key == $key) | .createdAt] | min // empty' <<< "$CACHES")
          if [ -z "$CURRENT_CREATED" ]; then
            echo "skip cache rollover: current cache is not available"
            exit 0
          fi

          # 只清理早于本次恢复、且早于当前缓存的条目。
          # 保护重叠构建新保存的缓存，也防止重跑旧提交删除较新的缓存。
          jq -r --arg key "$WRT_CACHE_KEY" --arg started "$WRT_CACHE_STARTED" --arg current "$CURRENT_CREATED" \
            '.[] | select(.key != $key and .createdAt < $started and .createdAt < $current) | .id' <<< "$CACHES" |
            while IFS= read -r CACHE_ID; do
              [ -n "$CACHE_ID" ] || continue
              gh cache delete "$CACHE_ID" --repo "$GH_REPO" ||
                echo "::warning::Failed to delete cache $CACHE_ID"
            done
 .config; then
            rm -f package/feeds/video/qt6quick package/feeds/video/qt6svg
          fi
          if ! grep -Eq '^CONFIG_PACKAGE_(fwknopd|luci-app-fwknopd)=y

          # Verify Kconfig retained the release metadata before any build work.
          if ! grep -q '^CONFIG_VERSIONOPT=y$' .config; then
            echo "::error::VERSIONOPT was not retained after defconfig; refusing to build."
            exit 1
          fi
          if ! grep -q '^CONFIG_VERSION_NUMBER="25.12.2"$' .config; then
            echo "::error::Stable version 25.12.2 was not retained after defconfig; refusing to build."
            grep -E '^CONFIG_VERSION_(OPT|NUMBER)' .config || true
            exit 1
          fi

          make clean -j$(nproc)

          # Fail closed: never publish firmware whose actual OpenWrt/ImmortalWrt
          VERSION_NUMBER=$(awk -F'"' '/^CONFIG_VERSION_NUMBER="/ { print $2; exit }' .config)
          if [[ -z "$VERSION_NUMBER" || "$VERSION_NUMBER" =~ [Ss][Nn][Aa][Pp][Ss][Hh][Oo][Tt] ]]; then
            echo "::error::Stable release required; CONFIG_VERSION_NUMBER is empty or SNAPSHOT ('$VERSION_NUMBER'). Refusing to build/publish development firmware."
            exit 1
          fi
          if [[ ! "$VERSION_NUMBER" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "::error::Unrecognized stable release version '$VERSION_NUMBER'. Expected a numeric release such as 25.12.2."
            exit 1
          fi
          echo "Stable release version accepted: $VERSION_NUMBER"

          echo "=== 正在执行 .config 配置断言校验 ==="
          FAIL=0

          # 1. 检查 SONiC FullCone 是否入选
          if ! grep -q "^CONFIG_PACKAGE_fullconenat-sonic=y" .config; then
            echo "::error::断言失败: CONFIG_PACKAGE_fullconenat-sonic 未入选！"
            FAIL=1
          fi

          # 2. 检查旧版 NSS 模块是否有残留
          if grep -q "^CONFIG_PACKAGE_kmod-qca-nss-" .config; then
            echo "::error::断言失败: 发现旧版 NSS 模块残留！"
            grep "^CONFIG_PACKAGE_kmod-qca-nss-" .config
            FAIL=1
          fi

          # 3. 检查旧版 FullCone 是否有残留冲突
          if grep -q "^CONFIG_PACKAGE_kmod-nft-fullcone=y" .config; then
            echo "::error::断言失败: 发现旧版 kmod-nft-fullcone 残留冲突！"
            FAIL=1
          fi

          # 4. 检查 PPE 硬件流表与 LuCI 防火墙核心 (包含 firewall4 与目标机型)
          if ! grep -q "^CONFIG_PACKAGE_kmod-nft-offload=y" .config; then
            echo "::error::断言失败: CONFIG_PACKAGE_kmod-nft-offload 未入选！"
            FAIL=1
          fi
          if ! grep -q "^CONFIG_PACKAGE_luci-app-firewall=y" .config; then
            echo "::error::断言失败: CONFIG_PACKAGE_luci-app-firewall 未入选！"
            FAIL=1
          fi
          if ! grep -q "^CONFIG_PACKAGE_firewall4=y" .config; then
            echo "::error::断言失败: CONFIG_PACKAGE_firewall4 未入选！"
            FAIL=1
          fi
          if ! grep -q "^CONFIG_TARGET_DEVICE_qualcommax_ipq60xx_DEVICE_jdcloud_re-cs-02=y" .config; then
            echo "::error::断言失败: 目标设备 CONFIG_TARGET_DEVICE_qualcommax_ipq60xx_DEVICE_jdcloud_re-cs-02 未入选！"
            FAIL=1
          fi

          # 5. PLUS 核心插件入选断言 (当 WRT_PROFILE 为 PLUS 时)
          if [[ "${WRT_PROFILE_UPPER:-${WRT_PROFILE}}" == "PLUS" ]]; then
            echo "--- 检查 PLUS 核心插件意图一致性 ---"
            for PKG in luci-app-passwall2 luci-app-adguardhome luci-app-wolultra luci-theme-argon; do
              PKG_INTENT="CONFIG_PACKAGE_${PKG}=y"
              if [[ -f .config.seed ]]; then
                PKG_INTENT=$(grep -E "^(#\s*)?CONFIG_PACKAGE_${PKG}(=|[[:space:]])" .config.seed | tail -n 1 || true)
              fi

              if [[ "$PKG_INTENT" == "CONFIG_PACKAGE_${PKG}=y" ]]; then
                if grep -q "^CONFIG_PACKAGE_${PKG}=y" .config; then
                  echo "  [PASS] PLUS 核心插件 ${PKG}: 已声明启用并成功入选"
                else
                  echo "::error::断言失败: PLUS 核心插件 ${PKG} 未实际入选！"
                  FAIL=1
                fi
              else
                echo "  [SKIP] PLUS 核心插件 ${PKG}: 源配置未声明启用，跳过校验"
              fi
            done
          fi

          # 6. 禁止重新引入已移除的 OpenClash / Docker 组件，并确保 Argon 主题入选
          for PKG in luci-app-openclash luci-app-dockerman dockerd docker docker-compose tini kmod-veth; do
            if grep -q "^CONFIG_PACKAGE_${PKG}=y" .config; then
              echo "::error::断言失败: 已移除组件 CONFIG_PACKAGE_${PKG} 被重新启用！"
              FAIL=1
            fi
          done
          if ! grep -q "^CONFIG_PACKAGE_luci-theme-argon=y" .config; then
            echo "::error::断言失败: luci-theme-argon 未实际入选！"
            FAIL=1
          fi

          # 7. Qualcomm PPE 时钟驱动补丁生效断言
          PPE_DRIVER="target/linux/qualcommax/files/drivers/net/ethernet/qualcomm/qca_ppe_main.c"
          IPQ6018_PATCH="target/linux/qualcommax/patches-6.18/0918-clk-qcom-gcc-ipq6018-keep-port-5-on-uniphy1-at-SGMII-rates.patch"
          IPQ8074_CONFLICT="target/linux/qualcommax/patches-6.18/0919-clk-qcom-gcc-ipq8074-keep-port-5-on-uniphy1-at-SGMII-rates.patch"
          if [ -d "target" ]; then
            if [ ! -f "$PPE_DRIVER" ]; then
              echo "::error::断言失败: Qualcomm PPE 驱动文件缺失 ($PPE_DRIVER)！"
              FAIL=1
            elif ! grep -q "ppe_port_clk_parents" "$PPE_DRIVER"; then
              echo "::error::断言失败: Qualcomm PPE 驱动未成功植入 QCA8081 时钟修复逻辑！"
              FAIL=1
            elif [ ! -s "$IPQ6018_PATCH" ]; then
              echo "::error::断言失败: IPQ6018 GCC 时钟补丁缺失或为空 ($IPQ6018_PATCH)！"
              FAIL=1
            elif [ -e "$IPQ8074_CONFLICT" ]; then
              echo "::error::断言失败: 检测到已废弃的 IPQ8074 冲突补丁残留 ($IPQ8074_CONFLICT)！"
              FAIL=1
            else
              echo "  [PASS] Qualcomm PPE QCA8081 时钟修复逻辑与分频补丁校验通过。"
            fi
          fi

          rm -f .config.seed

          if [[ $FAIL -ne 0 ]]; then
            echo "::error::配置断言校验失败，终止构建！"
            exit 1
          fi
          echo "=== .config 配置断言校验全部通过 ==="

      - name: Prepare Rust Toolchain
        if: env.WRT_TEST != 'true'
        run: |
          cd ./wrt/

          $GITHUB_WORKSPACE/.github/scripts/prepare-rust.sh

      - name: Download Packages
        if: env.WRT_TEST != 'true'
        run: |
          cd ./wrt/

          make download -j$(nproc)

      - name: Compile Firmware
        if: env.WRT_TEST != 'true'
        run: |
          cd ./wrt/

          mkdir -p $GITHUB_WORKSPACE/build-reports
          make -j$(nproc) BUILD_TIME_LOG="$GITHUB_WORKSPACE/build-reports/parallel.tsv" || \
            make -j1 V=s BUILD_TIME_LOG="$GITHUB_WORKSPACE/build-reports/serial.tsv"

      - name: Collect Build Reports
        if: env.WRT_TEST != 'true' && always()
        continue-on-error: true
        run: |
          cd ./wrt/

          $GITHUB_WORKSPACE/.github/scripts/collect-build-reports.sh

      - name: Upload Build Reports
        if: env.WRT_TEST != 'true' && always()
        continue-on-error: true
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: build-reports-${{env.WRT_CONFIG}}-${{env.WRT_PROFILE}}-${{env.WRT_INFO}}-${{github.run_attempt}}
          path: ./build-reports/
          retention-days: 7

      - name: Save Build Cache
        if: env.WRT_TEST != 'true' && success() && steps.check-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@9255dc7a253b0ccc959486e2bca901246202afeb # v5
        with:
          key: ${{env.WRT_CACHE_KEY}}
          path: |
            ./wrt/.ccache
            ./wrt/staging_dir/host*
            ./wrt/staging_dir/tool*

      - name: Machine Information
        run: |
          cd ./wrt/

          echo "======================="
          lscpu | grep -E "name|Core|Thread"
          echo "======================="
          df -h
          echo "======================="
          du -h --max-depth=1
          echo "======================="

      - name: Package Firmware
        run: |
          cd ./wrt/ && mkdir -p ./upload/

          cp -f ./.config ./upload/Config-"$WRT_CONFIG"-"$WRT_PROFILE"-"$WRT_INFO"-"$WRT_BRANCH"-"$WRT_DATE".txt
          if [ -s "$GITHUB_WORKSPACE/package-versions.txt" ]; then
            cp -f "$GITHUB_WORKSPACE/package-versions.txt" ./upload/Packages-"$WRT_CONFIG"-"$WRT_PROFILE"-"$WRT_INFO"-"$WRT_BRANCH"-"$WRT_DATE".txt
          fi

          if [[ $WRT_TEST != 'true' ]]; then
            echo "WRT_KVER=$(find ./bin/targets/ -type f -name "*.manifest" -exec grep -oP '^kernel - \K[\d\.]+' {} \;)" >> $GITHUB_ENV
            echo "WRT_LIST=$(find ./bin/targets/ -type f -name "*.manifest" -exec grep -oP '^luci-(app|theme)[^ ]*' {} \; | tr '\n' ' ')" >> $GITHUB_ENV

            find ./bin/targets/ -iregex ".*\(buildinfo\|json\|sha256sums\|packages\)$" -exec rm -rf {} +

            for FILE in $(find ./bin/targets/ -type f -iname "*$WRT_TARGET*") ; do
              EXT=$(basename $FILE | cut -d '.' -f 2-)
              NAME=$(basename $FILE | cut -d '.' -f 1 | grep -io "\($WRT_TARGET\).*")
              # 去掉恒定的平台前缀（qualcommax-），保留 ipq60xx 及设备型号
              NAME=${NAME#*-}
              NEW_FILE="$WRT_INFO"-"$WRT_BRANCH"-"${WRT_PROFILE,,}"-"$NAME"-"$WRT_DATE"."$EXT"
              mv -f $FILE ./upload/$NEW_FILE
            done

            find ./bin/targets/ -type f -exec mv -f {} ./upload/ \\;

            # Accept image formats emitted by the pinned target, including compressed images.
            mapfile -d '' FIRMWARE_FILES < <(
              find ./upload/ -maxdepth 1 -type f \\
                \\( -iname '*factory*.bin' -o -iname '*sysupgrade*.bin' \\
                   -o -iname '*factory*.img' -o -iname '*sysupgrade*.img' \\
                   -o -iname '*factory*.img.gz' -o -iname '*sysupgrade*.img.gz' \\
                   -o -iname '*factory*.ubi' -o -iname '*sysupgrade*.ubi' \\) -print0
            )
            if (( ${#FIRMWARE_FILES[@]} > 0 )); then
              (cd ./upload/ && sha256sum "${FIRMWARE_FILES[@]##*/}" > sha256sums.txt)
            else
              echo "::error::No factory/sysupgrade firmware images were packaged. Available target files:"
              find ./upload/ -maxdepth 1 -type f -printf '%f\\n' | sort
              exit 1
            fi
