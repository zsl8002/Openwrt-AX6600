            CPU架构：Qualcomm IPQ6010 / IPQ60xx
            ━━━━━━━━━━━━━━━━━━━━━━━

            ⚙️ 固件特性
            - Qualcomm PPE 开源硬件加速 + Linux 原生 Flowtable 硬件卸载
            - SONiC FullCone NAT1 游戏穿透支持
            - 基于 Linux 6.18 LTS 内核 / firewall4 架构
            - 常用 LuCI 插件预集成
            - 云端自动编译更新与极速构建优化
