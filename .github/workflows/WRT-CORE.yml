            提交版本：${{ env.WRT_HASH }}
            编译时间：${{ env.WRT_DATE }}
            ━━━━━━━━━━━━━━━━━━━━━━━

            📌 外部插件来源
            ${{ env.WRT_PKG_INFO }}
            ━━━━━━━━━━━━━━━━━━━━━━━

            🧩 设备与平台
            设备型号：${{ env.WRT_SOURCE }}
