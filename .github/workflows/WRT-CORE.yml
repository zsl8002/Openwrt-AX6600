#云编译公用核心
name: WRT-CORE

on:
  workflow_call:
    inputs:
      WRT_CONFIG:
        required: true
        type: string
      WRT_THEME:
        required: true
        type: string
      WRT_NAME:
        required: true
        type: string
      WRT_SSID:
        required: true
        type: string
      WRT_IP:
        required: true
        type: string
      WRT_PW:
        required: true
        type: string
      WRT_REPO:
        required: true
        type: string
      WRT_BRANCH:
        required: true
        type: string
      WRT_SOURCE:
        required: true
        type: string
      WRT_PACKAGE:
        required: false
        type: string
      WRT_PROFILE:
        required: false
        type: string
        default: PURE
      WRT_TEST:
        required: false
        type: boolean
        default: false
    secrets:
      WRT_WORD:
        required: false

permissions:
  contents: write

jobs:
  core:
    name: ${{inputs.WRT_SOURCE}}
    runs-on: ubuntu-latest
    env:
      WRT_CONFIG: ${{inputs.WRT_CONFIG}}
      WRT_THEME: ${{inputs.WRT_THEME}}
      WRT_NAME: ${{inputs.WRT_NAME}}
      WRT_SSID: ${{inputs.WRT_SSID}}
      WRT_IP: ${{inputs.WRT_IP}}
      WRT_REPO: ${{inputs.WRT_REPO}}
      WRT_BRANCH: ${{inputs.WRT_BRANCH}}
      WRT_SOURCE: ${{inputs.WRT_SOURCE}}
      WRT_PACKAGE: ${{inputs.WRT_PACKAGE}}
      WRT_PROFILE: ${{inputs.WRT_PROFILE}}
      WRT_PKG_INFO: 无（纯净版不集成外部插件）
      WRT_TEST: ${{inputs.WRT_TEST && 'true' || 'false'}}
    outputs:
      cache_prefix: ${{steps.initialize-cache.outputs.cache_prefix}}
      cache_key: ${{steps.initialize-cache.outputs.cache_key}}
      cache_started: ${{steps.initialize-cache.outputs.cache_started}}
    steps:
      - name: Checkout Projects
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          persist-credentials: false

      - name: Initialization Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get -yqq update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential bzip2 ca-certificates ccache clang \
            cmake cpio curl device-tree-compiler dos2unix file flex \
            g++-multilib gawk gcc-multilib genisoimage gettext git jq \
            libbpf-dev libclang-dev libdw-dev libelf-dev libncurses-dev libssl-dev lld \
            llvm ninja-build patch perl pkgconf python3 python3-cryptography \
            python3-dev python3-packaging python3-pyelftools python3-setuptools qemu-utils rsync swig \
            unzip wget xz-utils zlib1g-dev zstd
          sudo apt-get -yqq clean

          sudo timedatectl set-timezone "Asia/Shanghai"

          sudo mkdir -p /mnt/build_wrt
          sudo chown $USER:$USER /mnt/build_wrt
          sudo ln -s /mnt/build_wrt $GITHUB_WORKSPACE/wrt

      - name: Initialization Values
        run: |
          echo "WRT_DATE=$(TZ=UTC-8 date +"%y.%m.%d-%H.%M.%S")" >> $GITHUB_ENV
          echo "WRT_MARK=${GITHUB_REPOSITORY%%/*}" >> $GITHUB_ENV
          WRT_PROFILE_UPPER=$(echo "${WRT_PROFILE:-PURE}" | tr '[:lower:]' '[:upper:]')
          case "$WRT_PROFILE_UPPER" in
            PURE|PLUS) ;;
            *) echo "Unsupported WRT_PROFILE: $WRT_PROFILE" >&2; exit 1 ;;
          esac
          echo "WRT_PROFILE=$WRT_PROFILE_UPPER" >> $GITHUB_ENV
          if [[ "$WRT_PROFILE_UPPER" == "PLUS" ]]; then
            echo "WRT_PROFILE_DESC=Plus 版，预装 PassWall2、Argon 主题、AdGuard Home、DDNS、ttyd、UPnP 及分区扩容、网络唤醒等实用插件；启用 AdGuard Home 与代理服务前请先阅读 README 的「PLUS 版使用提示」" >> $GITHUB_ENV
          else
            echo "WRT_PROFILE_DESC=纯净版，轻量稳定，仅含基础网络与常用管理插件，扩展插件按需自行安装" >> $GITHUB_ENV
          fi
          WRT_INFO="${WRT_SOURCE%%/*}"
          echo "WRT_INFO=$WRT_INFO" >> $GITHUB_ENV
          echo "WRT_TARGET=$(grep -m 1 -oP '^CONFIG_TARGET_\K[\w]+(?=\=y)' ./Config/$WRT_CONFIG.txt)" >> $GITHUB_ENV
          echo "WRT_WIFI=wifi-yes" >> $GITHUB_ENV
          echo "WRT_EXTRA_CONFIG=$([[ -f ./Config/GENERAL_AX6600_${WRT_PROFILE_UPPER}.txt ]] && echo ./Config/GENERAL_AX6600_${WRT_PROFILE_UPPER}.txt || true)" >> $GITHUB_ENV
          echo "WRT_KVER=none" >> $GITHUB_ENV
          echo "WRT_LIST=none" >> $GITHUB_ENV

      - name: Validate Stable Source Pin
        shell: bash
        run: |
          set -euo pipefail
          # Only the reviewed, successfully built AX6600 stable source snapshot is allowed.
          STABLE_SOURCE="ones20250/immortalwrt_ipq"
          STABLE_COMMIT="ff74343745c7ba238f959372aca5a182d2eafb8f"
          if [[ "$WRT_SOURCE" != "$STABLE_SOURCE" ]]; then
            echo "::error::Unapproved source repository: $WRT_SOURCE"
            exit 1
          fi
          if [[ "$WRT_BRANCH" != "$STABLE_COMMIT" ]]; then
            echo "::error::Only the approved stable commit $STABLE_COMMIT is allowed; got: $WRT_BRANCH"
            exit 1
          fi
          if [[ ! "$WRT_BRANCH" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Source must be pinned to a full 40-character commit SHA; branches/tags/SNAPSHOT are forbidden."
            exit 1
          fi

      - name: Clone Code
        run: |
          set -euo pipefail
          git init ./wrt
          git -C ./wrt remote add origin "$WRT_REPO"
          git -C ./wrt fetch --depth=1 origin "$WRT_BRANCH"
          git -C ./wrt checkout --detach FETCH_HEAD
          ACTUAL_SOURCE_COMMIT=$(git -C ./wrt rev-parse HEAD)
          if [[ "$ACTUAL_SOURCE_COMMIT" != "$WRT_BRANCH" ]]; then
            echo "::error::Fetched source commit mismatch: expected $WRT_BRANCH, got $ACTUAL_SOURCE_COMMIT"
            exit 1
          fi

          cd ./wrt/ && echo "WRT_HASH=$(git log -1 --pretty=format:'%h')" >> $GITHUB_ENV

          # GitHub Action 移除国内下载源
          PROJECT_MIRRORS_FILE="./scripts/projectsmirrors.json"
          if [ -f "$PROJECT_MIRRORS_FILE" ]; then
            sed -i '/.cn\//d; /tencent/d; /aliyun/d' "$PROJECT_MIRRORS_FILE"
          fi

          # Plus 版补充 PassWall 依赖包 feed（xray/sing-box 等）。
          # LuCI 插件本体由 Packages.sh 克隆到 package/，这里不再加 LuCI feed，避免同名包双重定义。
          if [[ "$WRT_PROFILE" == "PLUS" ]]; then
            echo "src-git passwall_packages https://github.com/Openwrt-Passwall/openwrt-passwall-packages^efc4093be1477b66b95a33ca00e7a9d819ebc8fb" >> feeds.conf.default
          fi

      - name: Fix QCA8081 Port Clocks
        run: |
          cd ./wrt/
          bash "$GITHUB_WORKSPACE/.github/scripts/prepare-qca8081-clock-fix.sh"

      - name: Check Scripts
        run: |
          find ./ -maxdepth 3 -type f -iregex ".*\(txt\|sh\)$" -exec dos2unix {} \; -exec chmod +x {} \;

      # Cache lifecycle adapted from VIKINGYFY/OpenWRT-CI (MIT, Copyright 2026 VIKINGYFY).
      - name: Initialize Cache Values
        id: initialize-cache
        if: env.WRT_TEST != 'true'
        run: |
          WRT_SUBTARGET=$(grep -m 1 -oP "^CONFIG_TARGET_${WRT_TARGET}_\K[\w]+(?=\=y)" "./Config/$WRT_CONFIG.txt")
          WRT_CACHE_SOURCE=${WRT_SOURCE//\//-}
          WRT_CACHE_BRANCH=${WRT_BRANCH//\//-}
          # 保留目标硬件配置名($WRT_CONFIG)隔离；固件版本($WRT_PROFILE)不加入键，PURE/PLUS 共用工具链与 ccache 缓存
          WRT_CACHE_PREFIX="wrt-$WRT_CACHE_SOURCE-$WRT_CACHE_BRANCH-$WRT_TARGET-$WRT_SUBTARGET-$WRT_CONFIG"
          WRT_CACHE_KEY="$WRT_CACHE_PREFIX-$(git -C ./wrt rev-parse HEAD)"
          WRT_CACHE_STARTED=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          {
            echo "WRT_CACHE_PREFIX=$WRT_CACHE_PREFIX"
            echo "WRT_CACHE_KEY=$WRT_CACHE_KEY"
          } >> "$GITHUB_ENV"
          {
            echo "cache_prefix=$WRT_CACHE_PREFIX"
            echo "cache_key=$WRT_CACHE_KEY"
            echo "cache_started=$WRT_CACHE_STARTED"
          } >> "$GITHUB_OUTPUT"

      - name: Restore Build Cache
        id: check-cache
        if: env.WRT_TEST != 'true'
        uses: actions/cache/restore@9255dc7a253b0ccc959486e2bca901246202afeb # v5
        with:
          # 缓存内容（ccache/宿主工具/工具链）与 profile 无关，PURE 和 PLUS 共享同一份，避免缓存翻倍挤占配额
          key: ${{env.WRT_CACHE_KEY}}
          # 迁移时仅回退到同一源码提交的旧键，避免旧前缀混用其他分支。
          restore-keys: |
            ${{env.WRT_CACHE_PREFIX}}-
            ${{env.WRT_CONFIG}}-${{env.WRT_INFO}}-${{env.WRT_HASH}}
          path: |
            ./wrt/.ccache
            ./wrt/staging_dir/host*
            ./wrt/staging_dir/tool*

      - name: Prepare Restored Build Cache
        if: env.WRT_TEST != 'true' && steps.check-cache.outputs.cache-matched-key != ''
        run: |
          if [ -d "./wrt/staging_dir" ]; then
            find "./wrt/staging_dir" -type d -name "stamp" -not -path "*target*" | while read -r DIR; do
              find "$DIR" -type f -exec touch {} +
            done

            mkdir -p ./wrt/tmp && echo "1" > ./wrt/tmp/.build

            echo "toolchain skipped done!"
          else
            echo "caches missed!"
          fi

      - name: Update Feeds
        run: |
          cd ./wrt/

          ./scripts/feeds update -a
          ./scripts/feeds install -a
          # 额外强制安装缺失的 python 依赖
          ./scripts/feeds install -f python3-pysocks python3-unidecode


      - name: Custom Packages
        run: |
          cd ./wrt/package/

          : > "$GITHUB_WORKSPACE/package-versions.txt"
          $GITHUB_WORKSPACE/Scripts/Packages.sh
          if [[ "$WRT_PROFILE" == "PLUS" && -e ../feeds/passwall_packages/.git ]]; then
            echo "passwall_packages(feed) Openwrt-Passwall/openwrt-passwall-packages $(git -C ../feeds/passwall_packages rev-parse HEAD)" >> "$GITHUB_WORKSPACE/package-versions.txt"
          fi
          if [ -s "$GITHUB_WORKSPACE/package-versions.txt" ]; then
            {
              echo 'WRT_PKG_INFO<<EOF'
              cat "$GITHUB_WORKSPACE/package-versions.txt"
              echo 'EOF'
            } >> "$GITHUB_ENV"
          fi
          #$GITHUB_WORKSPACE/Scripts/Handles.sh

          cd $GITHUB_WORKSPACE/wrt/
          $GITHUB_WORKSPACE/.github/scripts/prepare-i2c-tools.sh

      - name: Custom Settings
        env:
          WRT_WORD: ${{secrets.WRT_WORD}}
        run: |
          cd ./wrt/

          # Config-only validation never publishes firmware; use an ephemeral key
          # if the repository secret is absent. Real firmware builds still require
          # the unique WRT_WIFI_PASSWORD secret.
          if [[ "$WRT_TEST" == "true" ]]; then
            WRT_WORD="${WRT_WORD:-$(openssl rand -hex 16)}"
          elif [[ -z "${WRT_WORD:-}" ]]; then
            echo "::error::Configure repository secret WRT_WIFI_PASSWORD (12-63 characters) before building firmware."
            exit 1
          fi
          export WRT_WORD

          if [[ "${WRT_CONFIG,,}" == *"test"* ]]; then
            cat $GITHUB_WORKSPACE/Config/$WRT_CONFIG.txt >> .config
          else
            #cat $GITHUB_WORKSPACE/Config/$WRT_CONFIG.txt $GITHUB_WORKSPACE/Config/GENERAL.txt >> .config
            cat $GITHUB_WORKSPACE/Config/$WRT_CONFIG.txt $GITHUB_WORKSPACE/Config/GENERAL_AX6600.txt ${WRT_EXTRA_CONFIG:+$GITHUB_WORKSPACE/${WRT_EXTRA_CONFIG#./}} >> .config
          fi

          $GITHUB_WORKSPACE/Scripts/Settings.sh
          $GITHUB_WORKSPACE/.github/scripts/prepare-build-host.sh

          cp .config .config.seed

          # The pinned source hides VERSIONOPT behind IMAGEOPT, which is not
          # defined in this source tree. Remove that prompt-only gate so Kconfig
          # can retain the explicit stable release metadata from GENERAL_AX6600.txt.
          sed -i 's/bool "Version configuration options" if IMAGEOPT/bool "Version configuration options"/' package/base-files/image-config.in
          if grep -q 'bool "Version configuration options" if IMAGEOPT' package/base-files/image-config.in; then
            echo "::error::Could not expose VERSIONOPT in the pinned source Kconfig."
            exit 1
          fi

          # The pinned vendor feed snapshot contains several unrelated packages
          # with known recursive Kconfig dependencies. Remove only their feed
          # symlinks when none of those packages was requested in this firmware.
          # Keep the feed repositories and every explicitly selected package.
          if ! grep -Eq '^CONFIG_PACKAGE_qt5base-[^=]+=y

          # Verify Kconfig retained the release metadata before any build work.
          if ! grep -q '^CONFIG_VERSIONOPT=y$' .config; then
            echo "::error::VERSIONOPT was not retained after defconfig; refusing to build."
            exit 1
          fi
          if ! grep -q '^CONFIG_VERSION_NUMBER="25.12.2"$' .config; then
            echo "::error::Stable version 25.12.2 was not retained after defconfig; refusing to build."
            grep -E '^CONFIG_VERSION_(OPT|NUMBER)' .config || true
            exit 1
          fi

          make clean -j$(nproc)

          # Fail closed: never publish firmware whose actual OpenWrt/ImmortalWrt
          VERSION_NUMBER=$(awk -F'"' '/^CONFIG_VERSION_NUMBER="/ { print $2; exit }' .config)
          if [[ -z "$VERSION_NUMBER" || "$VERSION_NUMBER" =~ [Ss][Nn][Aa][Pp][Ss][Hh][Oo][Tt] ]]; then
            echo "::error::Stable release required; CONFIG_VERSION_NUMBER is empty or SNAPSHOT ('$VERSION_NUMBER'). Refusing to build/publish development firmware."
            exit 1
          fi
          if [[ ! "$VERSION_NUMBER" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "::error::Unrecognized stable release version '$VERSION_NUMBER'. Expected a numeric release such as 25.12.2."
            exit 1
          fi
          echo "Stable release version accepted: $VERSION_NUMBER"

          echo "=== 正在执行 .config 配置断言校验 ==="
          FAIL=0

          # 1. 检查 SONiC FullCone 是否入选
          if ! grep -q "^CONFIG_PACKAGE_fullconenat-sonic=y" .config; then
            echo "::error::断言失败: CONFIG_PACKAGE_fullconenat-sonic 未入选！"
            FAIL=1
          fi

          # 2. 检查旧版 NSS 模块是否有残留
          if grep -q "^CONFIG_PACKAGE_kmod-qca-nss-" .config; then
            echo "::error::断言失败: 发现旧版 NSS 模块残留！"
            grep "^CONFIG_PACKAGE_kmod-qca-nss-" .config
            FAIL=1
          fi

          # 3. 检查旧版 FullCone 是否有残留冲突
          if grep -q "^CONFIG_PACKAGE_kmod-nft-fullcone=y" .config; then
            echo "::error::断言失败: 发现旧版 kmod-nft-fullcone 残留冲突！"
            FAIL=1
          fi

          # 4. 检查 PPE 硬件流表与 LuCI 防火墙核心 (包含 firewall4 与目标机型)
          if ! grep -q "^CONFIG_PACKAGE_kmod-nft-offload=y" .config; then
            echo "::error::断言失败: CONFIG_PACKAGE_kmod-nft-offload 未入选！"
            FAIL=1
          fi
          if ! grep -q "^CONFIG_PACKAGE_luci-app-firewall=y" .config; then
            echo "::error::断言失败: CONFIG_PACKAGE_luci-app-firewall 未入选！"
            FAIL=1
          fi
          if ! grep -q "^CONFIG_PACKAGE_firewall4=y" .config; then
            echo "::error::断言失败: CONFIG_PACKAGE_firewall4 未入选！"
            FAIL=1
          fi
          if ! grep -q "^CONFIG_TARGET_DEVICE_qualcommax_ipq60xx_DEVICE_jdcloud_re-cs-02=y" .config; then
            echo "::error::断言失败: 目标设备 CONFIG_TARGET_DEVICE_qualcommax_ipq60xx_DEVICE_jdcloud_re-cs-02 未入选！"
            FAIL=1
          fi

          # 5. PLUS 核心插件入选断言 (当 WRT_PROFILE 为 PLUS 时)
          if [[ "${WRT_PROFILE_UPPER:-${WRT_PROFILE}}" == "PLUS" ]]; then
            echo "--- 检查 PLUS 核心插件意图一致性 ---"
            for PKG in luci-app-passwall2 luci-app-adguardhome luci-app-wolultra luci-theme-argon; do
              PKG_INTENT="CONFIG_PACKAGE_${PKG}=y"
              if [[ -f .config.seed ]]; then
                PKG_INTENT=$(grep -E "^(#\s*)?CONFIG_PACKAGE_${PKG}(=|[[:space:]])" .config.seed | tail -n 1 || true)
              fi

              if [[ "$PKG_INTENT" == "CONFIG_PACKAGE_${PKG}=y" ]]; then
                if grep -q "^CONFIG_PACKAGE_${PKG}=y" .config; then
                  echo "  [PASS] PLUS 核心插件 ${PKG}: 已声明启用并成功入选"
                else
                  echo "::error::断言失败: PLUS 核心插件 ${PKG} 未实际入选！"
                  FAIL=1
                fi
              else
                echo "  [SKIP] PLUS 核心插件 ${PKG}: 源配置未声明启用，跳过校验"
              fi
            done
          fi

          # 6. 禁止重新引入已移除的 OpenClash / Docker 组件，并确保 Argon 主题入选
          for PKG in luci-app-openclash luci-app-dockerman dockerd docker docker-compose tini kmod-veth; do
            if grep -q "^CONFIG_PACKAGE_${PKG}=y" .config; then
              echo "::error::断言失败: 已移除组件 CONFIG_PACKAGE_${PKG} 被重新启用！"
              FAIL=1
            fi
          done
          if ! grep -q "^CONFIG_PACKAGE_luci-theme-argon=y" .config; then
            echo "::error::断言失败: luci-theme-argon 未实际入选！"
            FAIL=1
          fi

          # 7. Qualcomm PPE 时钟驱动补丁生效断言
          PPE_DRIVER="target/linux/qualcommax/files/drivers/net/ethernet/qualcomm/qca_ppe_main.c"
          IPQ6018_PATCH="target/linux/qualcommax/patches-6.18/0918-clk-qcom-gcc-ipq6018-keep-port-5-on-uniphy1-at-SGMII-rates.patch"
          IPQ8074_CONFLICT="target/linux/qualcommax/patches-6.18/0919-clk-qcom-gcc-ipq8074-keep-port-5-on-uniphy1-at-SGMII-rates.patch"
          if [ -d "target" ]; then
            if [ ! -f "$PPE_DRIVER" ]; then
              echo "::error::断言失败: Qualcomm PPE 驱动文件缺失 ($PPE_DRIVER)！"
              FAIL=1
            elif ! grep -q "ppe_port_clk_parents" "$PPE_DRIVER"; then
              echo "::error::断言失败: Qualcomm PPE 驱动未成功植入 QCA8081 时钟修复逻辑！"
              FAIL=1
            elif [ ! -s "$IPQ6018_PATCH" ]; then
              echo "::error::断言失败: IPQ6018 GCC 时钟补丁缺失或为空 ($IPQ6018_PATCH)！"
              FAIL=1
            elif [ -e "$IPQ8074_CONFLICT" ]; then
              echo "::error::断言失败: 检测到已废弃的 IPQ8074 冲突补丁残留 ($IPQ8074_CONFLICT)！"
              FAIL=1
            else
              echo "  [PASS] Qualcomm PPE QCA8081 时钟修复逻辑与分频补丁校验通过。"
            fi
          fi

          rm -f .config.seed

          if [[ $FAIL -ne 0 ]]; then
            echo "::error::配置断言校验失败，终止构建！"
            exit 1
          fi
          echo "=== .config 配置断言校验全部通过 ==="

      - name: Prepare Rust Toolchain
        if: env.WRT_TEST != 'true'
        run: |
          cd ./wrt/

          $GITHUB_WORKSPACE/.github/scripts/prepare-rust.sh

      - name: Download Packages
        if: env.WRT_TEST != 'true'
        run: |
          cd ./wrt/

          make download -j$(nproc)

      - name: Compile Firmware
        if: env.WRT_TEST != 'true'
        run: |
          cd ./wrt/

          mkdir -p $GITHUB_WORKSPACE/build-reports
          make -j$(nproc) BUILD_TIME_LOG="$GITHUB_WORKSPACE/build-reports/parallel.tsv" || \
            make -j1 V=s BUILD_TIME_LOG="$GITHUB_WORKSPACE/build-reports/serial.tsv"

      - name: Collect Build Reports
        if: env.WRT_TEST != 'true' && always()
        continue-on-error: true
        run: |
          cd ./wrt/

          $GITHUB_WORKSPACE/.github/scripts/collect-build-reports.sh

      - name: Upload Build Reports
        if: env.WRT_TEST != 'true' && always()
        continue-on-error: true
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: build-reports-${{env.WRT_CONFIG}}-${{env.WRT_PROFILE}}-${{env.WRT_INFO}}-${{github.run_attempt}}
          path: ./build-reports/
          retention-days: 7

      - name: Save Build Cache
        if: env.WRT_TEST != 'true' && success() && steps.check-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@9255dc7a253b0ccc959486e2bca901246202afeb # v5
        with:
          key: ${{env.WRT_CACHE_KEY}}
          path: |
            ./wrt/.ccache
            ./wrt/staging_dir/host*
            ./wrt/staging_dir/tool*

      - name: Machine Information
        run: |
          cd ./wrt/

          echo "======================="
          lscpu | grep -E "name|Core|Thread"
          echo "======================="
          df -h
          echo "======================="
          du -h --max-depth=1
          echo "======================="

      - name: Package Firmware
        run: |
          cd ./wrt/ && mkdir -p ./upload/

          cp -f ./.config ./upload/Config-"$WRT_CONFIG"-"$WRT_PROFILE"-"$WRT_INFO"-"$WRT_BRANCH"-"$WRT_DATE".txt
          if [ -s "$GITHUB_WORKSPACE/package-versions.txt" ]; then
            cp -f "$GITHUB_WORKSPACE/package-versions.txt" ./upload/Packages-"$WRT_CONFIG"-"$WRT_PROFILE"-"$WRT_INFO"-"$WRT_BRANCH"-"$WRT_DATE".txt
          fi

          if [[ $WRT_TEST != 'true' ]]; then
            echo "WRT_KVER=$(find ./bin/targets/ -type f -name "*.manifest" -exec grep -oP '^kernel - \K[\d\.]+' {} \;)" >> $GITHUB_ENV
            echo "WRT_LIST=$(find ./bin/targets/ -type f -name "*.manifest" -exec grep -oP '^luci-(app|theme)[^ ]*' {} \; | tr '\n' ' ')" >> $GITHUB_ENV

            find ./bin/targets/ -iregex ".*\(buildinfo\|json\|sha256sums\|packages\)$" -exec rm -rf {} +

            for FILE in $(find ./bin/targets/ -type f -iname "*$WRT_TARGET*") ; do
              EXT=$(basename $FILE | cut -d '.' -f 2-)
              NAME=$(basename $FILE | cut -d '.' -f 1 | grep -io "\($WRT_TARGET\).*")
              # 去掉恒定的平台前缀（qualcommax-），保留 ipq60xx 及设备型号
              NAME=${NAME#*-}
              NEW_FILE="$WRT_INFO"-"$WRT_BRANCH"-"${WRT_PROFILE,,}"-"$NAME"-"$WRT_DATE"."$EXT"
              mv -f $FILE ./upload/$NEW_FILE
            done

            find ./bin/targets/ -type f -exec mv -f {} ./upload/ \\;

            # Accept image formats emitted by the pinned target, including compressed images.
            mapfile -d '' FIRMWARE_FILES < <(
              find ./upload/ -maxdepth 1 -type f \\
                \\( -iname '*factory*.bin' -o -iname '*sysupgrade*.bin' \\
                   -o -iname '*factory*.img' -o -iname '*sysupgrade*.img' \\
                   -o -iname '*factory*.img.gz' -o -iname '*sysupgrade*.img.gz' \\
                   -o -iname '*factory*.ubi' -o -iname '*sysupgrade*.ubi' \\) -print0
            )
            if (( ${#FIRMWARE_FILES[@]} > 0 )); then
              (cd ./upload/ && sha256sum "${FIRMWARE_FILES[@]##*/}" > sha256sums.txt)
            else
              echo "::error::No factory/sysupgrade firmware images were packaged. Available target files:"
              find ./upload/ -maxdepth 1 -type f -printf '%f\\n' | sort
              exit 1
            fi
            make clean -j$(nproc)
          fi

      - name: Build Summary
        run: |
          {
            echo "## WRT Build Summary"
            echo ""
            echo "- Source: \`$WRT_SOURCE\`"
            echo "- Branch: \`$WRT_BRANCH\`"
            echo "- Config: \`$WRT_CONFIG\`"
            echo "- Profile: \`$WRT_PROFILE\`"
            echo "- Target: \`$WRT_TARGET\`"
            echo "- Firmware mode: \`$WRT_WIFI\`"
            echo "- Build time: \`$WRT_DATE\`"
            echo "- Kernel: \`$WRT_KVER\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Release Firmware
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.WRT_CONFIG }}-${{ env.WRT_PROFILE }}-${{ env.WRT_INFO }}-${{ env.WRT_BRANCH }}-${{ env.WRT_DATE }}
          files: ./wrt/upload/*.*
          body: |
            📦 OpenWrt 自动编译固件（AX6600 / IPQ6010）
            ━━━━━━━━━━━━━━━━━━━━━━━

            📌 基本信息
            <!-- 源码仓库：${{ env.WRT_REPO }} -->
